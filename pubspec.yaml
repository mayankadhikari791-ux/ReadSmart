name: read_smart
description: "ReadSmart - Smart Reading Companion & E-Reader Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  cloud_functions: ^5.1.3
  google_sign_in: ^6.2.1

  # Local persistence (fallback + settings)
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Cryptography (local auth password hashing)
  crypto: ^3.0.3

  # UI & Utilities
  cupertino_icons: ^1.0.6
  intl: ^0.20.3

  # PDF Reader
  pdfx: ^2.9.0
  file_picker: ^8.1.7

  # Networking & APIs
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
